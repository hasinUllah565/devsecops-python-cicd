
<!doctype html>
{% set authed = current_user.is_authenticated %}
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Secure Task Management System">

    <title>{% block title %}Dashboard{% endblock %} · SecureTasks</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- JavaScript -->
    <script
        src="{{ url_for('static', filename='js/script.js') }}"
        defer
    ></script>
</head>

<body>

<div class="{{ 'app-shell' if authed else 'guest-shell' }}">

    {% if authed %}
    <aside
        class="sidebar offcanvas-lg offcanvas-start"
        tabindex="-1"
        id="sidebar"
        aria-label="Main navigation"
    >

        <div class="sidebar-inner">

            <!-- Brand -->
            <a class="sidebar-brand" href="{{ url_for('main.dashboard') }}">
                <span class="brand-mark">
                    <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                </span>
                <span>SecureTasks</span>
            </a>

            <!-- Navigation -->
            <nav class="sidebar-nav">

                <span class="nav-heading">Workspace</span>

                <a
                    class="nav-link-app {{ 'active' if request.endpoint == 'main.dashboard' }}"
                    href="{{ url_for('main.dashboard') }}"
                >
                    <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
                    Dashboard
                </a>

                <a
                    class="nav-link-app {{ 'active' if request.endpoint in ('main.tasks', 'main.edit_task') }}"
                    href="{{ url_for('main.tasks') }}"
                >
                    <i class="fa-solid fa-list-check" aria-hidden="true"></i>
                    All tasks
                </a>

                <a
                    class="nav-link-app {{ 'active' if request.endpoint == 'main.create_task' }}"
                    href="{{ url_for('main.create_task') }}"
                >
                    <i class="fa-solid fa-circle-plus" aria-hidden="true"></i>
                    New task
                </a>

                <span class="nav-heading">Quick filters</span>

                <a
                    class="nav-link-app"
                    href="{{ url_for('main.tasks', status='pending') }}"
                >
                    <i class="fa-regular fa-clock" aria-hidden="true"></i>
                    Pending
                </a>

                <a
                    class="nav-link-app"
                    href="{{ url_for('main.tasks', status='in_progress') }}"
                >
                    <i class="fa-solid fa-spinner" aria-hidden="true"></i>
                    In Progress
                </a>

            </nav>
        </div>
    </aside>
    {% endif %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
