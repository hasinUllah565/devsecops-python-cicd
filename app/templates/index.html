{% extends "base.html" %}
{% block title %}Welcome{% endblock %}

{% block content %}
<div class="landing-minimal d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card-surface text-center p-4 p-sm-5 shadow-lg border" style="max-width: 440px; width: 100%;">
    <!-- Brand Mark & Title -->
    <div class="d-inline-flex align-items-center justify-content-center mb-3">
      <span class="brand-mark" style="width: 52px; height: 52px; font-size: 1.5rem; border-radius: 16px;">
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      </span>
    </div>

    <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
      <h1 class="h3 fw-bold mb-0">SecureTasks</h1>
      <span class="brand-badge">PRO</span>
    </div>

    <!-- Action Buttons: Sign In and Sign Up -->
    <div class="d-grid gap-3 pt-2">
      <a class="btn btn-brand btn-lg w-100 py-2" href="{{ url_for('auth.login') }}">
        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Sign in
      </a>
      <a class="btn btn-outline-secondary btn-lg w-100 py-2" href="{{ url_for('auth.register') }}">
        <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Sign up
      </a>
    </div>
  </div>
</div>
{% endblock %}
